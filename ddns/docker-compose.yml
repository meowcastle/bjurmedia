services:
  ddns:
    image: alpine:3.20
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./ddns-update.sh:/ddns-update.sh:ro
    # Check every 5 minutes. A no-op check is two tiny API reads per record,
    # well inside Cloudflare's free-tier rate limits.
    command: >
      sh -c "apk add --no-cache curl jq >/dev/null &&
             while true; do sh /ddns-update.sh; sleep 300; done"
